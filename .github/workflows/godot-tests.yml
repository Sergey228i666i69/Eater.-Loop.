name: Godot Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Parser and runtime suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS assets
        run: git lfs pull

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Parser check
        run: godot --headless --check-only -s res://tests/run_tests.gd

      - name: Runtime tests
        run: bash tests/run_tests.sh

  export-smoke:
    name: MacOS export smoke
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS assets
        run: git lfs pull

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Create export directory
        run: mkdir -p exports/ci

      - name: Export MacOS debug build
        run: godot --headless --path . --export-debug "MacOS" exports/ci/EaterLoop.app
